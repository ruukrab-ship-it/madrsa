<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل الأنشطة والتطوع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .card-custom {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }
        .form-label {
            color: #334155;
            font-weight: 600;
        }
        .form-control, .form-select {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            border-radius: 8px;
            padding: 12px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            color: #0f172a;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .form-control::placeholder {
            color: #94a3b8;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 700;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card card-custom p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-dark mb-1">تسجيل الأنشطة والتطوع</h2>
                        <p class="text-muted small">يرجى اختيار الفصل والمرحلة بدقة وتعبئة البيانات</p>
                    </div>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">اسم الطالب</label>
                            <input type="text" class="form-control" name="full_name" placeholder="أدخل اسم الطالب الثلاثي" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الفصل الدراسي</label>
                            <select class="form-select" name="grade_class" required>
                                <option value="" selected disabled>اختر الفصل</option>
                                
                                <!-- أولى ثانوي -->
                                <optgroup label="أولى ثانوي">
                                    <option value="أولى ثانوي 1/1">1/1</option>
                                    <option value="أولى ثانوي 1/2">1/2</option>
                                    <option value="أولى ثانوي 1/3">1/3</option>
                                    <option value="أولى ثانوي 1/4">1/4</option>
                                    <option value="أولى ثانوي 1/5">1/5</option>
                                    <option value="أولى ثانوي 1/6">1/6</option>
                                    <option value="أولى ثانوي 1/7">1/7</option>
                                    <option value="أولى ثانوي 1/8">1/8</option>
                                    <option value="أولى ثانوي 1/9">1/9</option>
                                    <option value="أولى ثانوي 1/10">1/10</option>
                                </optgroup>

                                <!-- ثاني ثانوي -->
                                <optgroup label="ثاني ثانوي">
                                    <option value="ثاني ثانوي 2/1">2/1</option>
                                    <option value="ثاني ثانوي 2/2">2/2</option>
                                    <option value="ثاني ثانوي 2/3">2/3</option>
                                    <option value="ثاني ثانوي 2/4">2/4</option>
                                    <option value="ثاني ثانوي 2/5">2/5</option>
                                    <option value="ثاني ثانوي 2/6">2/6</option>
                                    <option value="ثاني ثانوي 2/7">2/7</option>
                                    <option value="ثاني ثانوي 2/8">2/8</option>
                                </optgroup>

                                <!-- ثالث ثانوي -->
                                <optgroup label="ثالث ثانوي">
                                    <option value="ثالث ثانوي 3/1">3/1</option>
                                    <option value="ثالث ثانوي 3/2">3/2</option>
                                    <option value="ثالث ثانوي 3/3">3/3</option>
                                    <option value="ثالث ثانوي 3/4">3/4</option>
                                    <option value="ثالث ثانوي 3/5">3/5</option>
                                    <option value="ثالث ثانوي 3/6">3/6</option>
                                    <option value="ثالث ثانوي 3/7">3/7</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">رقم الجوال</label>
                            <input type="tel" class="form-control" name="phone" placeholder="05xxxxxxxx" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">رقم الهوية</label>
                            <input type="text" class="form-control" name="national_id" placeholder="أدخل رقم الهوية الوطنية" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">المجالات (اختر المجال المناسب)</label>
                            <select class="form-select" name="domain" required>
                                <option value="" selected disabled>اختر المجال</option>
                                <option value="مجال التطوع">مجال التطوع</option>
                                <option value="مجال العلوم والتقنيه">مجال العلوم والتقنيه</option>
                                <option value="المجال الثقافي">المجال الثقافي</option>
                                <option value="المجال صحه">المجال صحه</option>
                                <option value="المجال الكشفي">المجال الكشفي</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100">تسجيل البيانات</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
